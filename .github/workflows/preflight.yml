# Fast pre-merge feedback for the maintainer, using the self-hosted runner's
# persistent state (incremental cargo target, local LFS, pre-fetched ONNX
# runtime, pinned MSRV toolchain). ADDITIVE: the required merge gate stays the
# GitHub-hosted ci.yml, which builds from scratch in a deterministic
# environment; this surfaces breakage in minutes instead of tens, on real
# hardware-adjacent state (rolling Arch).
#
# SECURITY: this triggers on `push`, NOT `pull_request`. A `pull_request` run
# executes the workflow file taken from the PR's own head commit, so a fork PR
# could edit an `if:` guard to `true` and run on the personal-machine runner if
# a maintainer ever approved it (and "Approve and run" cannot be scoped to
# hosted CI alone). A `push` event, by contrast, can only be triggered by
# someone with push access to THIS repo — a fork cannot push here at all — so no
# untrusted code ever reaches the runner, with no dependence on the approval
# wall or an in-file guard. Feedback still appears on same-repo PRs via the
# commit status. `main` is excluded (it runs the full hosted ci.yml).
name: Preflight (self-hosted)

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

# A newer push to the same branch cancels the in-flight preflight: the runner
# is a single machine, and only the latest commit's verdict matters here.
concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight · fmt · clippy · test (archhost)
    runs-on: [self-hosted, arch]
    timeout-minutes: 40
    env:
      # The ACTUAL pin (review round): PATH alone selects rustup's proxies
      # but leaves the toolchain to rustup's mutable default; this override
      # outranks default and directory overrides, and auto-install off keeps
      # the job on the pre-provisioned runner instead of a silent network
      # install.
      RUSTUP_TOOLCHAIN: "1.88.0"
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      # rustup's proxies (NOT the rolling pacman rust: clippy 1.97's
      # question_mark lint failed this job on code the pinned gate
      # accepts); RUSTUP_TOOLCHAIN above makes the selection explicit.
      - name: Select the pinned rustup toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify the pinned toolchain
        run: |
          set -euo pipefail
          test "$(cargo --version | awk '{print $2}')" = "1.88.0" || {
            echo "::error::cargo is not the pinned 1.88.0"
            cargo --version || true
            exit 1
          }
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: doc (broken intra-doc links are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: build (release)
        run: cargo build --release --locked

      # Guarded because `cargo test` exits 0 even when it discovers no tests at
      # all. The floor sits well below the real count (707 at 0.7.0).
      - name: test
        run: ./scripts/run-tests-guarded.sh --min 650 -- cargo test --workspace --locked

      - name: cargo-deny (advisories · licenses · duplicate versions)
        run: cargo-deny check

      # The hosted gate runs these against swtpm; here they hit the REAL TPM
      # (device:/dev/tpmrm0, the built-in default — ghrunner is in the tss
      # group). Verified to pass unprivileged on this hardware before wiring:
      # the pcrlock test provisions and cleans its own throwaway NV index.
      # The daemon tpm_ test self-guards (swtpm-only by design) and is kept
      # for command parity with ci.yml.
      # The count assertion this step used to carry now lives in the shared
      # guard, which names the set instead of counting it: renaming one of these
      # while adding another would leave the total at 6 and hide the loss.
      - name: test (TPM-gated, against the REAL TPM)
        run: |
          ./scripts/run-tests-guarded.sh --require seal_unseal_roundtrip_real_tpm,arm_and_unseal_roundtrip,reseal_only_when_stale,tpm_key_and_recovery_lifecycle,tpm_tampered_seal_falls_back_then_recovery_heals,seal_unseal_pcrlock_roundtrip_provisioned_nv \
            -- cargo test -p irlume-core --lib --locked -- --ignored \
            seal_unseal_roundtrip_real_tpm arm_and_unseal_roundtrip reseal_only_when_stale \
            tpm_key_and_recovery_lifecycle tpm_tampered_seal_falls_back_then_recovery_heals seal_unseal_pcrlock_roundtrip_provisioned_nv \
            --test-threads=1
          # The daemon tpm_ test self-guards to swtpm-only; kept for parity.
          ./scripts/run-tests-guarded.sh --min 1 -- cargo test -p irlume-daemon --locked -- --ignored tpm_ --test-threads=1

      # Same loopback camera matrix as the hosted gate. The nodes are
      # provisioned persistently on the runner (v4l2loopback-dkms, modules-load
      # + modprobe.d options video_nr=8,9,10, udev rule granting group video),
      # so no root is needed at job time; the feeders live only for this step.
      - name: test (camera + capture paths, against v4l2loopback)
        env:
          IRLUME_TEST_RGB_DEVICE: /dev/video8
          IRLUME_TEST_IR_DEVICE: /dev/video9
          IRLUME_TEST_SPARE_DEVICE: /dev/video10
          IRLUME_TEST_ALLOW_VIRTUAL_CAMERA: /dev/video8,/dev/video9
        run: |
          if [ ! -w /dev/video8 ] || [ ! -w /dev/video9 ]; then
            echo "::error::loopback nodes missing or not writable — re-provision v4l2loopback on the runner"
            exit 1
          fi
          ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x480:rate=30 -pix_fmt yuyv422 -f v4l2 /dev/video8 >/dev/null 2>&1 &
          ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x400:rate=30 -pix_fmt gray -f v4l2 /dev/video9 >/dev/null 2>&1 &
          trap 'kill %1 %2 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            if [ -r /dev/video8 ] && [ -r /dev/video9 ]; then break; fi
            sleep 1
          done
          ./scripts/run-tests-guarded.sh --min 15 -- cargo test -p irlume-camera -p irlume-auth -p irlume-daemon --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 7 -- cargo test -p irlume-cli --test cli_capture --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 5 -- cargo test -p irlume-cli --test cli_bench --locked -- --ignored bench_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 1 -- cargo test -p irlume-daemon --test shutdown --locked -- --ignored --test-threads=1

      - name: test (PAM FFI, against pam_wrapper)
        run: ./scripts/run-tests-guarded.sh --min 16 -- cargo test -p irlume-pam --locked -- --include-ignored --test-threads=1

  # The rest of the hosted gate's non-Rust checks, on the same push trigger
  # (fork PRs can never reach this runner; see the SECURITY note above). Two
  # ci.yml steps stay hosted-only on purpose: the systemd exposure ratchet
  # (its thresholds are measured on the hosted image's systemd 255, and this
  # runner's rolling systemd scores differently) and coverage/fuzz/nix
  # (toolchain provisioning on the runner is its own change).
  gate-extras:
    name: gate-extras · packaging · apparmor · units (archhost)
    runs-on: [self-hosted, arch]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: packaging parity (units in every lane, versions agree)
        run: ./scripts/check-packaging-parity.sh

      # This runner's parser is rolling (4.1.x): the same newest-parser check
      # the hosted gate runs on its 4.x.
      - name: apparmor profiles parse
        run: |
          set -euo pipefail
          for f in packaging/apparmor/*; do
            echo "checking $f on the runner's parser"
            apparmor_parser -QK "$f"
          done

      # Same oldest-supported-parser check as the hosted gate; the ubuntu:22.04
      # image is pre-pulled on the runner so the outage-prone registry fetch is
      # not in the loop.
      - name: apparmor profiles parse on the oldest supported parser
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/packaging/apparmor:/p:ro" ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get -qq update >/dev/null
            apt-get -qq install -y apparmor >/dev/null
            apparmor_parser --version
            useradd -m checker
            for f in /p/*; do
              echo "checking $f"
              su checker -c "apparmor_parser -QK $f"
            done'

      - name: test-count guard self-test
        run: ./scripts/run-tests-guarded.sh --self-test

      - name: PPA publish verifier (verdict logic)
        run: python3 scripts/verify-ppa-publish.py --self-test

      # verify resolves ExecStart. On this runner irlume is REALLY installed,
      # so no stub is needed; the guard exists so this job can never overwrite
      # a real binary the way the hosted job's unconditional stub would.
      - name: systemd-analyze verify (unit syntax)
        run: |
          set -euo pipefail
          for bin in irlumed irlume; do
            if [ ! -e "/usr/bin/$bin" ]; then
              echo "::error::/usr/bin/$bin missing on the runner; refusing to stub over a live system"
              exit 1
            fi
          done
          for u in packaging/systemd/*.service packaging/systemd/*.timer packaging/systemd/*.path; do
            echo "::group::verify $(basename "$u")"
            systemd-analyze verify "$u"
            echo "::endgroup::"
          done
