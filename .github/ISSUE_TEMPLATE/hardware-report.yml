name: Hardware report
description: A camera, IR emitter, fingerprint reader, or TPM that misbehaves with irlume
title: "[hw] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Most hardware fixes start from the same three command outputs. Filling them in
        up front usually saves a full round-trip. If you can, also attach the
        output of `irlume support-report` (sanitized and safe to share), and
        `irlume camera census --json` (it classifies every camera-like device
        with the evidence each row keyed on, so "broken, unsupported class, or
        configuration" is answered before the first reply). Before filing, also
        try the two-minute kernel check in
        docs/DEBUGGING.md ("Cameras: check the kernel first"): most camera
        misbehavior has a uvcvideo quirk-table entry for your exact USB ID.
  - type: input
    id: machine
    attributes:
      label: Machine and camera
      description: Laptop or camera model, plus the USB ID if you know it (`lsusb | grep -i cam`)
      placeholder: "ASUS Zenbook S 14, 04f2:b6d9"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and desktop
      placeholder: "Fedora 44 KDE (Wayland)"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `irlume doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: detect
    attributes:
      label: Output of `irlume detect` and `irlume version`
      render: text
    validations:
      required: true
  - type: textarea
    id: census
    attributes:
      label: Output of `irlume camera census --json`
      description: Classifies every camera-like device on the machine; optional but it usually replaces the first diagnostic round-trip
      render: text
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what you expected
      description: If login or enrollment failed, add the relevant lines from `irlume logs --since "10 min ago"`
    validations:
      required: true
