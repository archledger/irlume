[package]
name = "irlume-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "irlumed"
path = "src/main.rs"

[dependencies]
irlume-common.workspace = true
irlume-auth.workspace = true
irlume-core.workspace = true
irlume-liveness.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
sha2.workspace = true
libc = "0.2"
dbus.workspace = true

[dev-dependencies]
irlume-camera = { workspace = true, features = ["test-support"] }
# Whole-call split rows (ADR-0032 step 5) install evidence scripts through
# irlume-auth's test-support seam. A dev-dependency feature like the camera
# and core ones above: resolver 2 keeps it out of release builds.
irlume-auth = { workspace = true, features = ["test-support"] }
# The TPM-presence pin for tests that write account stores
# (template_key::test_support). A dev-dependency feature: resolver 2 keeps
# it out of release builds.
irlume-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
