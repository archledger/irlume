[package]
name = "irlume-vision"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["onnx", "tflite"]
# ONNX inference (AuraFace embedder, YuNet detector). Off => align/cosine only.
# FaceMesh dispatches to the TFLite backend for the production mesh, so
# enabling onnx requires the tflite binding (MR !3 review: the independent
# combination stopped compiling).
onnx = ["dep:ort", "tflite"]
# Native TFLite/LiteRT runtime (#295): runs pinned .tflite artifacts
# unconverted via a dlopen'd libtensorflowlite_c; absence is a recoverable
# runtime answer, not a build requirement, so the feature costs nothing on
# systems without the library.
tflite = ["dep:edgefirst-tflite"]
# Hardware-acceleration execution providers, selected at compile time (cf. howrs).
# Default build = CPU. The heavy math runs inside ONNX Runtime, already SIMD +
# multi-threaded; compiling one of these features only makes a provider
# AVAILABLE: it is registered (strictly, CPU fallback disabled, loudly warned,
# TensorRT ahead of CUDA, OpenVINO pinned to the GPU device) only behind the
# exact escape IRLUME_TEST_ALLOW_UNCERTIFIED_EP=1, because the providers run
# outside the per-model certification regime (ADR-0033 §7). Without the escape
# the provider stays unregistered, the automatic device-selection policy is
# pinned to CPU (the crate's default prefers an NPU) and every session warns
# that it runs on the CPU. CoreML is never registered (every MLComputeUnits
# combination admits the CPU) and a build that compiled it is told it stays
# inactive. Our own glue loops vectorize via target-cpu
# (see .cargo/config.toml).
cuda = ["ort/cuda"]
openvino = ["ort/openvino"]
coreml = ["ort/coreml"]
tensorrt = ["ort/tensorrt"]
# Optional NPU inference under per-model certification (ADR-0022). Off by
# default. The OpenVINO C API is loaded at run time by its versioned soname
# (runtime-linking), so the feature builds without OpenVINO installed and an
# absent runtime is a CPU answer, not a build or start failure.
npu = ["onnx", "dep:openvino", "dep:openvino-sys"]

[dependencies]
libc.workspace = true   # dlopen/dlsym probe: prove a library is loadable ort BEFORE ort can park on it (#266)
irlume-common.workspace = true
thiserror.workspace = true
ort = { workspace = true, optional = true }
# Pinned EXACTLY: wrapper 0.10.1 and locked sys 0.10.2 are reviewed in
# docs/research/tflite-0.10.1-audit.md. Default-off drops ZIP/metadata features,
# but FlatBuffers is now unconditional. Our post-hash layout guard refuses
# offset-stored buffers before the loader can repack the verified allocation.
edgefirst-tflite = { version = "=0.10.3", optional = true, default-features = false }
rustfft.workspace = true
# Pinned EXACTLY (ADR-0022 §5): Apache-2.0 bindings from intel/openvino-rs,
# generated for the OpenVINO 2026.1 C API; runtime-linking resolves each
# symbol through libloading from the soname the `npu` module loads.
openvino = { version = "=0.11.0", optional = true, default-features = false, features = ["runtime-linking"] }
openvino-sys = { version = "=0.11.0", optional = true, default-features = false, features = ["runtime-linking"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
# Decodes the recorded RGB evaluation frames of the ignored NPU hardware
# test (ADR-0022 §7); never linked into a shipped binary.
image.workspace = true

[[example]]
name = "tflite_runtime_probe"
required-features = ["tflite"]

[lints]
workspace = true
