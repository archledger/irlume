[package]
name = "irlume-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

# The shared authentication orchestration: capture RGB+IR -> detect -> align ->
# embed + liveness gate -> match. Used by both the CLI and the irlumed daemon so
# the security-critical pipeline lives in exactly one place.

[features]
default = []
ir-only-evaluation = ["dep:libc", "irlume-camera/capture-timing"]
# Test-support evidence scripts for whole-call split rows (ADR-0032 step 5).
# Enabled by dependent crates under [dev-dependencies] only; resolver v2
# keeps it out of release builds, like irlume-camera's own test-support.
test-support = []

[[example]]
name = "ir_only_evaluation"
required-features = ["ir-only-evaluation"]

[dependencies]
libc = { workspace = true, optional = true }
sha2.workspace = true
irlume-common.workspace = true
irlume-camera.workspace = true
irlume-vision.workspace = true
irlume-liveness.workspace = true
irlume-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
irlume-camera = { workspace = true, features = ["test-support"] }
# The TPM-presence pin in the request fixtures (template_key::test_support).
# A dev-dependency feature: resolver 2 keeps it out of release builds.
irlume-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[[example]]
name = "ir_recorded_pad"
required-features = ["ir-only-evaluation"]
