# Custom labels of the self-hosted runner fleet (archhost), so actionlint can
# validate runs-on lines instead of flagging them as unknown.
self-hosted-runner:
  labels:
    - arch
    - ir-camera
    - tpm
    # Shared by BOTH machines, so a light job can land on either instead of
    # making one of them a single point of failure for a required check.
    - ci
    # minihost (Intel N100, CachyOS) capability labels.
    - cachyos
    - n100
