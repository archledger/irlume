# Attest the verified digests of packages built and signed off CI. This does
# not turn the maintainer's build into an isolated, reproducible CI build.
name: SLSA release provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest after all signed assets are uploaded"
        required: true
        type: string

permissions:
  contents: read

jobs:
  hashes:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
      tag: ${{ steps.hash.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets

      - name: Verify every package and produce subjects
        id: hash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Validate before writing a tag into the line-oriented outputs file.
          git check-ref-format "refs/tags/$RELEASE_TAG"
          digests="$(python3 scripts/verify-release-assets.py assets --subjects)"
          {
            echo "digests=$digests"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  provenance:
    needs: hashes
    permissions:
      actions: read
      id-token: write
      contents: write
    # The generator's verification identity requires a version tag, not a SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.digests }}
      upload-assets: true
      upload-tag-name: ${{ needs.hashes.outputs.tag }}
      provenance-name: multiple.intoto.jsonl

  confirm-upload:
    needs: [hashes, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require an actual upload to the requested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.hashes.outputs.tag }}
          UPLOADED_RELEASE: ${{ needs.provenance.outputs.release-id }}
        run: |
          set -euo pipefail
          test -n "$UPLOADED_RELEASE"
          expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)"
          test "$UPLOADED_RELEASE" = "$expected"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern multiple.intoto.jsonl
          test -s multiple.intoto.jsonl
