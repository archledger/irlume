[Unit]
# Preparation is a fresh oneshot on every start, before any LightDM command.
# A failure or mask prevents an unprotected start. It never starts irlumed.
Requires=irlume-lightdm-prepare.service
After=irlume-lightdm-prepare.service
Wants=irlume-lightdm-refresh.path irlume-lightdm-refresh.timer

[Service]
# systemd resolves bind sources against the host root before switching roots.
# The ordinary-service links keep following host policy, including in sessions
# that inherit this mount namespace. Only LightDM's own roots are projected.
BindReadOnlyPaths=/etc/pam.d:/run/irlume-lightdm-source/etc
BindReadOnlyPaths=-/usr/lib/pam.d:/run/irlume-lightdm-source/vendor
BindReadOnlyPaths=/run/irlume-lightdm/pam.d:/etc/pam.d
BindReadOnlyPaths=/run/irlume-lightdm
# Root-owned retained session module only, also on hosts mounting /run noexec.
ExecPaths=/run/irlume-lightdm
# Refuse startup if a platform silently omits filesystem namespacing.
ExecStartPre=/usr/bin/irlume login lightdm-view-check
