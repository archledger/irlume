# Weekly automation of the install matrix that release prep previously ran by
# hand (docs/PLATFORMS.md): build the universal .deb in its debian:12 container,
# install it on every supported Debian/Ubuntu base and smoke-test the CLI, and
# do a full build+test pass on rolling Arch. A failed scheduled run emails the
# maintainer; the sibling-project lesson behind it is that advertised install
# lanes rot silently unless CI exercises them (a Nix lane elsewhere shipped
# broken twice, found only by user bug reports).
name: Install matrix

on:
  schedule:
    - cron: "45 6 * * 1" # Mondays 06:45 UTC, after the advisory audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: build universal .deb (debian:12, podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reach.
          persist-credentials: false

      # Same model cache as ci.yml (shared key): the ~257 MB weights are
      # fetched from the models-v1 release, cached so warm runs skip the pull.
      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models/SHA256SUMS') }}

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: Build the .deb (packaging/debian/build-deb-container.sh)
        run: bash packaging/debian/build-deb-container.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: irlume-deb
          path: irlume_*_amd64.deb
          if-no-files-found: error
          retention-days: 7

  install-smoke:
    name: install smoke (${{ matrix.image }})
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The bases the universal .deb promises to support (glibc 2.35 floor):
        # oldest Debian, oldest supported Ubuntu LTS, current LTS bases.
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: irlume-deb

      - name: Install on a bare image
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./irlume_*_amd64.deb

      - name: CLI smoke
        run: |
          irlume version
          # detect's contract: 0 = ready, 10 = partial, 20 = absent. A bare
          # container has no camera/TPM, so any of the three is a pass; anything
          # else (a crash, a missing shared library) fails the lane.
          rc=0; irlume detect || rc=$?
          case "$rc" in 0|10|20) echo "detect exit $rc (ok)";;
                        *) echo "unexpected detect exit $rc"; exit 1;; esac

  arch-build-test:
    name: build + test on Arch (rolling toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Pinned by digest, not `:latest`: a mutable tag means the image can change
      # under us between runs, and a compromised push would execute here. This
      # does NOT weaken the "rolling toolchain" purpose of the job, because the
      # first step runs a full `pacman -Syu`, so the packages under test are
      # current regardless of how old the base layer is. Refresh the digest when
      # the base drifts far enough that a full upgrade gets unwieldy.
      # archlinux:latest as of 2026-07-20.
      image: archlinux@sha256:592e11bd99ab579f933a0cb77a8f66e2f3ae57f5eafacf13aea44a6e98ef21ae
    steps:
      - name: Install toolchain and system deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust clang pam tpm2-tss curl ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reach.
          persist-credentials: false

      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models/SHA256SUMS') }}

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: |
          # Container job: checkout writes safe.directory into a temporary
          # HOME, so later steps' git sees "dubious ownership" and git
          # operations report "Not in a Git repository" (first dispatch failed
          # exactly here). Re-assert it in this step's real HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/fetch-models.sh

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Fetch the ONNX runtime (ort loads it dynamically at runtime)
        run: |
          ver=1.28.1
          curl -fsSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-${ver}.tgz"
          tar xzf "onnxruntime-linux-x64-${ver}.tgz"
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime-linux-x64-${ver}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: build
        run: cargo build --workspace --locked

      # Guarded because `cargo test` exits 0 even when it discovers no tests at
      # all. The floor sits well below the real count (707 at 0.7.0).
      - name: test
        run: ./scripts/run-tests-guarded.sh --min 650 -- cargo test --workspace --locked
