#
# KCM build lane: compiles the Plasma System Settings module and runs its
# headless load test in the two KF6 lanes that ship it (Fedora rpm via
# Copr, Arch). The universal deb and NixOS carry no KCM yet (see
# docs/superpowers/specs/2026-09-18-kcm-plasma-settings-design.md).
#
# No `uses:` beyond one SHA-pinned checkout: everything runs inside the
# distro containers, so there is nothing else to pin.
name: kcm

on:
  pull_request:
    paths:
      - "kcm/**"
      - ".github/workflows/kcm.yml"
  push:
    branches:
      - main
    paths:
      - "kcm/**"
      - ".github/workflows/kcm.yml"

permissions:
  contents: read

jobs:
  build:
    name: "kcm build + loadtest (${{ matrix.container }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - fedora:44
          - archlinux:base-devel
    steps:
      - name: Install git (checkout runs inside the container)
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y -q git
          else
            pacman -Sy --noconfirm git
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install KF6/Qt6 build dependencies
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y -q cmake extra-cmake-modules gcc-c++ \
              qt6-qtbase-devel qt6-qtdeclarative-devel \
              kf6-kcmutils-devel kf6-kcoreaddons-devel kf6-kio-devel kf6-kirigami
          else
            pacman -Sy --noconfirm cmake extra-cmake-modules gcc \
              qt6-base qt6-declarative kcmutils kcoreaddons kio kirigami
          fi

      - name: Build the module and its load test
        run: |
          cmake -S kcm -B kcm-build -DBUILD_TESTING=ON
          cmake --build kcm-build -j"$(nproc)"

      - name: Headless load test (plugin metadata, factory, bridge)
        run: |
          # The bridge prefers /usr/bin/irlume; this container has no real
          # CLI, so a contract-shaped stub exercises the exec/parse paths.
          # (The real CLI + daemon path runs on the maintainer's KDE
          # hardware and in the packaging lanes.)
          cat > /usr/bin/irlume <<'STUB'
          #!/bin/sh
          case "$1 ${2:-}" in
            "version "*) printf '%s\n' '{"contract_version":1,"engine_version":"0.13.0","command":"version","ok":true,"data":{"capabilities":["version-json","status-json","doctor-json","camera-census","login-status-json"],"contract_versions":{"min":1,"max":1},"limits":{"max_profiles":3}}}' ;;
            "status "*) printf '%s\n' '{"contract_version":1,"engine_version":"0.13.0","command":"status","ok":true,"data":{"daemon":"running","auth_method":"auto","face_disabled":false,"fingerprint":false,"fingerprint_known":true,"camera":{"known":true,"rgb":true,"ir":true},"enrollment":{"known":true,"profiles":1,"scans":10},"keyring":{"known":true,"armed":true},"recovery":{"known":true,"passphrase_set":true,"key_present":true},"templates":"encrypted"}}' ;;
            "doctor "*) printf '%s\n' '{"contract_version":1,"engine_version":"0.13.0","command":"doctor","ok":true,"data":{"checks":[{"id":"platform","state":"info","detail":"stub"}]}}' ;;
            "camera census") printf '%s\n' '{"contract_version":1,"engine_version":"0.13.0","command":"camera.census","ok":true,"data":{"entries":[]}}' ;;
            "login "*) printf '%s\n' '{"contract_version":1,"engine_version":"0.13.0","command":"login.status","ok":true,"data":{"surfaces":[]}}' ;;
            *) exit 2 ;;
          esac
          STUB
          chmod +x /usr/bin/irlume
          ./kcm-build/bin/kcm_loadtest "$(pwd)/kcm-build/bin/plasma/kcms/systemsettings/kcm_irlume.so"

      - name: Runtime QML instantiation check (offscreen kcmshell6)
        run: |
          # A qmllint pass does not catch runtime QML errors (a nonexistent
          # property or an undefined binding reached the user's System
          # Settings that way once). Instantiate the real module offscreen
          # and fail on any QML error it reports.
          cmake --install kcm-build
          command -v kcmshell6 || { echo "kcmshell6 not available; skipped"; exit 0; }
          log="$(mktemp)"
          rc=0
          timeout 15 env QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 \
            kcmshell6 kcm_irlume 2>&1 | tee "$log" || rc=$?
          # 124 = timeout killed the event loop, which is the clean-load
          # outcome (kcmshell6 otherwise runs until terminated). Any other
          # nonzero status is a real failure and exits here (the step runs
          # with -e -o pipefail).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          if grep -aqE "qrc:|Unable to assign|Cannot assign|Error loading QML" "$log"; then
            echo "::error::the module reported QML errors on instantiation"
            exit 1
          fi

      - name: QML lint with resolved Kirigami/KCMUtils types
        run: |
          # With the qml import path, qmllint RESOLVES Kirigami and KCMUtils
          # types, so a nonexistent property (twinFormLabelText,
          # Theme.secondaryTextColor - both shipped once) fails here at
          # build time instead of in the user's System Settings.
          if [ -x /usr/lib64/qt6/bin/qmllint ]; then
            QMLLINT=/usr/lib64/qt6/bin/qmllint
          elif [ -x /usr/lib/qt6/bin/qmllint ]; then
            QMLLINT=/usr/lib/qt6/bin/qmllint
          else
            echo "::error::qmllint not available"
            exit 1
          fi
          status=0
          for f in kcm/src/ui/*.qml; do
            out="$("$QMLLINT" -I /usr/lib64/qt6/qml -I /usr/lib/qt6/qml "$f" 2>&1)" || status=1
            if printf '%s\n' "$out" | grep -qE "Warning: .*:(missing-property|unqualified|syntax)|Error"; then
              status=1
              printf '%s\n' "$out"
            fi
          done
          exit $status
