# CodeRabbit review configuration for this repository.
#
# reviews.finishing_touches.unit_tests controls the "Generate unit tests"
# finishing touch. When it commits onto the pull request branch, the commit
# is unsigned and carries no DCO trailer, so the DCO check fails and the
# branch has to be reset before the pull request can merge (as on #1403).
# The touch is off here. The other finishing touches are not changed by
# this file.
#
# inheritance is on so the review settings saved for this repository and
# for the organization in CodeRabbit still apply below this file. A file
# without it is the only configuration layer, and every setting the file
# leaves out falls back to the schema defaults.
#
# A repository file is also read with the V2 schema, and some V2 defaults
# differ from the V3 defaults that applied before this file: sequence
# diagrams, the estimated review effort, the linked issue assessment, the
# in-progress fortune, chat art, and the built-in title, description and
# issue assessment checks are on in V2 and off in V3. They are pinned here
# to off, the value each had before this file. Every key below is in the
# documented configuration reference.
inheritance: true
chat:
  art: false
reviews:
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  in_progress_fortune: false
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  finishing_touches:
    unit_tests:
      enabled: false
