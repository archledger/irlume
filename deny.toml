# cargo-deny configuration; CI runs `cargo deny check advisories bans licenses`.

[licenses]
# Every dependency license must be on this list or the build fails. All entries
# are OSI-permissive or GPL-compatible; GPL-3.0 is present because irlume itself
# is GPL-3.0-or-later and the pamsm PAM binding is GPL-3.0-only. No non-commercial
# or network-copyleft (AGPL/SSPL/Commons-Clause) license is allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "0BSD",
    "LGPL-2.1-or-later",
    "GPL-3.0-only",    # pamsm fork (archledger/pam_sm_rust); canonical SPDX form
    "GPL-3.0-or-later", # irlume's own crates
]
# Do not fail when an allowed license happens to be unused after a dep bump.
unused-allowed-license = "allow"

# webpki-roots carries the Mozilla CA store under CDLA-Permissive-2.0 (a
# permissive data license). It reaches the tree only as a BUILD-dependency of
# edgefirst-tflite-sys via ureq: Cargo COMPILES it into that crate's build
# script regardless, but its code path runs solely under the `vendored`
# feature irlume keeps OFF, and nothing of it links into any shipped binary.
# Scoped to the one crate rather than allowing the license globally, so a
# future RUNTIME dependency under CDLA still trips this check and gets its
# own decision. (Upstream gating of ureq behind the vendored feature would
# remove the need; noted on irlume #295.)
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0071 ("Marvin" RSA timing side-channel): no fixed release
    # exists upstream. irlume uses the rsa crate only to parse the systemd
    # PCR-signing PUBLIC key and verify signatures (crates/irlume-core/src/
    # pcrsig.rs); no private-key operations run, so the side channel has no
    # secret to leak here. Re-check when rsa publishes a fixed version.
    "RUSTSEC-2023-0071",
]

[bans]
# Duplicate crate versions cost compile time and binary size but are not errors.
multiple-versions = "warn"

[sources]
# The workspace intentionally has exactly two git dependencies: the tss-esapi
# fork and the pamsm fork (archledger/pam_sm_rust, ADR-0012). Any other git
# or non-crates.io source appearing in the tree should fail CI until it is
# reviewed and listed here.
unknown-git = "deny"
unknown-registry = "deny"
allow-git = [
    "https://github.com/archledger/rust-tss-esapi",
    "https://github.com/archledger/pam_sm_rust",
]
