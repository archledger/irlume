name: Bug report
description: Something broke that is not tied to a specific camera, reader, or TPM
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      # Folded on purpose: GitHub shows every newline of this text as a line
      # break, so a paragraph is one folded line, and two blank lines
      # separate paragraphs.
      value: >
        **Security problem, or not sure?** If a photo, video, mask or another
        person got in, face sign-in worked without your face, or face data was
        exposed, do not file it here and do not post it publicly. Report it
        privately: https://github.com/archledger/irlume/security (or the
        e-mail address in
        [SECURITY.md](https://github.com/archledger/irlume/blob/main/SECURITY.md)).


        A report in your own words is fine.


        For camera, IR emitter, fingerprint reader, or TPM problems, the
        Hardware report template asks for the right details instead.


        If you can, attach the file `irlume support-report --since 10m`
        writes: run it without sudo, read it, then attach it in the
        "What happened" box, since the log box takes text only. The file has
        no frames, templates, credentials, user names, camera serial numbers,
        raw device paths, journal text or scores. It does list when your
        account recently used irlume (each face or keyring attempt, and how
        it ended), your kernel version, and how your cameras connect
        (USB IDs, ports, drivers). With irlume older than 0.15.0 it lists
        every account's attempts, not only yours. A file is uploaded as soon
        as you attach it, and anyone with its link can open it.


        Never paste or attach captures, embeddings, template files,
        `irlume trace` files, or the output of `irlume identify` or
        `irlume status`.
  - type: input
    id: version
    attributes:
      label: irlume version and install channel
      description: "`irlume version`, plus how you installed (Copr, PPA, .deb, AUR, Nix, source, or a nightly lane: Copr irlume-nightly, AUR irlume-git, PPA irlume-nightly); `irlume doctor`'s install-origin line names it"
      placeholder: "0.16.0, Fedora Copr"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and desktop
      placeholder: "Fedora 44 KDE (Wayland)"
    validations:
      required: true
  # Each option is an issue_area in .github/labels.toml, which turns the
  # answer into labels (scripts/ci/test-auto-label.py keeps the two in step).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the problem shows up, if you know. Pick any that apply.
      multiple: true
      options:
        - Login, lock screen, sudo or polkit (PAM)
        - Enrollment
        - Face recognition or matching
        - Liveness or anti-spoofing
        - Camera or IR emitter
        - TPM or Secure Boot
        - Keyring or wallet unlock
        - Fingerprint
        - The irlume command or its TUI
        - KDE System Settings module
        - Installing or packaging
        - Not sure
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what you expected
      description: >
        Attach the support report file here if you made one (see the top of
        this form).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: >
        The support report file is the easiest (see the top of this form).
        `irlume doctor` output helps too; it shows your account name and, if
        you added a second camera, that camera's serial number, which you may
        replace. Paste journal lines (`irlume logs --since "10 min ago"`,
        `journalctl -u irlumed`) only if you have no report file or a
        maintainer asks. They show your user and computer names, and can show
        face profile names and face-match scores: replace the names and
        delete the scores first. Paste no line from a time when debug logging
        was on; `irlume logs debug` tells only whether it is on now, not
        whether it was.
      render: text
    validations:
      required: false
