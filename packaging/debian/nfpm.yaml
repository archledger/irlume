# nfpm manifest for the Debian/Ubuntu .deb (distributed via GitHub Releases).
# Build with:  bash packaging/debian/build-deb.sh   (stages files, then nfpm pkg)
#
# Bundles onnxruntime because the Ubuntu/Debian archive ships 1.22 but irlume
# needs >=1.24 (the api-24 pin). Everything else is a normal dependency.
name: irlume
arch: amd64
platform: linux
version: 0.11.2
section: admin
priority: optional
maintainer: archledger <archledger236@gmail.com>
description: |
  Windows Hello-style face login for Linux.
  IR (Windows Hello) cameras get the secure tier: login, sudo, and TPM-sealed
  keyring unlock with algorithmic IR liveness. Regular RGB webcams get screen
  unlock; a fingerprint reader can join as a companion factor. Thin PAM module
  + privileged daemon; YuNet + AuraFace. Password is always the fallback.
vendor: irlume
homepage: https://github.com/archledger/irlume
license: GPL-3.0-or-later

depends:
  # The binaries reference GLIBC_2.35 symbols at most (built on debian:12,
  # measured with objdump), so dpkg refuses on anything older instead of
  # installing binaries that die at runtime with a GLIBC version error.
  # build-deb.sh asserts the binaries' real floor stays within this declaration.
  - libc6 (>= 2.35)
  # The bundled TFLite runtime is C++; its GLIBCXX floor is asserted by
  # build-deb.sh against the GCC-12-era baseline of the declared systems.
  - libstdc++6
  - libpam0g
  - libtss2-esys-3.0.2-0 | libtss2-esys-3.0.2-0t64
  # tctildr is the TCTI loader the binary links directly; it is NOT pulled in
  # by libtss2-esys (esys drags in mu/sys/tcti-device, but not tctildr), so a
  # clean install without it leaves irlumed crash-looping on a missing .so.
  # (The PPA build computes this automatically via ${shlibs:Depends}.)
  - libtss2-tctildr0 | libtss2-tctildr0t64
recommends:
  - fprintd

contents:
  - src: ../../target/release/irlumed
    dst: /usr/bin/irlumed
  - src: ../../target/release/irlume
    dst: /usr/bin/irlume
  - src: ../../target/release/libpam_irlume.so
    dst: /usr/lib/x86_64-linux-gnu/security/pam_irlume.so
  # KDE wallet handoff helper. libexec, not bin: it is not a command a user
  # runs, it takes a secret on stdin, and it is only meaningful inside a PAM
  # transaction.
  - src: ../../target/release/irlume-kwallet-init
    dst: /usr/libexec/irlume/irlume-kwallet-init
  - src: ../../target/release/irlume-gkr-unlock
    dst: /usr/libexec/irlume/irlume-gkr-unlock
  # Bundled models (fetched from the models-v1 release by build-deb.sh)
  - src: ../../models/glintr100.onnx
    dst: /usr/share/irlume/models/glintr100.onnx
  - src: ../../models/face_detection_yunet_2023mar.onnx
    dst: /usr/share/irlume/models/face_detection_yunet_2023mar.onnx
  - src: ../../models/face_landmark.onnx
    dst: /usr/share/irlume/models/face_landmark.onnx
  - src: ../../models/face_landmarks_detector.tflite
    dst: /usr/share/irlume/models/face_landmarks_detector.tflite
  - src: ../../models/blaze_face_short_range.onnx
    dst: /usr/share/irlume/models/blaze_face_short_range.onnx
  - src: ../../models/liveness_vit.onnx
    dst: /usr/share/irlume/models/liveness_vit.onnx
  - src: ../../models/flir.onnx
    dst: /usr/share/irlume/models/flir.onnx
  # Bundled onnxruntime (>=1.24) staged by build-deb.sh
  - src: ../../.deb-staging/onnxruntime/lib/
    dst: /opt/irlume/onnxruntime/lib/
  # Bundled TFLite C runtime staged by build-deb.sh (#295); the daemon's
  # resolver probes /usr/share/irlume/tflite, so it ships at the probed path
  # rather than /opt.
  - src: ../../.deb-staging/tflite/lib/libtensorflowlite_c.so
    dst: /usr/share/irlume/tflite/libtensorflowlite_c.so
  - src: ../../.deb-staging/tflite/LICENSE.tensorflow
    dst: /usr/share/irlume/tflite/LICENSE.tensorflow
  - src: ../licenses/THIRD-PARTY-NOTICES.tflite
    dst: /usr/share/irlume/tflite/THIRD-PARTY-NOTICES
  - src: ../../.deb-staging/tflite/PROVENANCE
    dst: /usr/share/irlume/tflite/PROVENANCE
  # systemd unit + an override pointing ORT at the bundled lib
  - src: ../systemd/irlumed.service
    dst: /usr/lib/systemd/system/irlumed.service
  - src: ../systemd/irlumed.socket
    dst: /usr/lib/systemd/system/irlumed.socket
  - src: ../../.deb-staging/10-ort.conf
    dst: /usr/lib/systemd/system/irlumed.service.d/10-ort.conf
  # Self-heal: re-applies irlume's greeter PAM lines if a distro update
  # (pam-auth-update, a fresh vendor PAM file) strips them. Enabled in
  # postinstall; no-op until `irlume login enable` writes its marker.
  - src: ../systemd/irlume-reconcile.path
    dst: /usr/lib/systemd/system/irlume-reconcile.path
  - src: ../systemd/irlume-reconcile.service
    dst: /usr/lib/systemd/system/irlume-reconcile.service
  - src: ../systemd/irlume-reconcile.timer
    dst: /usr/lib/systemd/system/irlume-reconcile.timer
  # tmpfiles.d: setgid root:video lock directory for the IR-emitter exclusion
  # locks (#542); the daemon's bounding set has no CAP_CHOWN, so the group
  # must be inherited at creation.
  - src: ../tmpfiles.d/irlume.conf
    dst: /usr/lib/tmpfiles.d/irlume.conf
  # AppArmor profile (enforces by default; see the profile header)
  - src: ../apparmor/usr.bin.irlumed
    dst: /etc/apparmor.d/usr.bin.irlumed
  - src: ../../LICENSE
    dst: /usr/share/doc/irlume/LICENSE
  - src: ../../README.md
    dst: /usr/share/doc/irlume/README.md
  # The machine-API contract, beside the engine that implements it.
  - src: ../../schemas/machine-api-v1.schema.json
    dst: /usr/share/irlume/schemas/machine-api-v1.schema.json
  - src: ../../docs/MACHINE-API.md
    dst: /usr/share/doc/irlume/MACHINE-API.md
  - src: ../../docs/INTEGRATION.md
    dst: /usr/share/doc/irlume/INTEGRATION.md

scripts:
  postinstall: ./postinstall.sh
  preremove: ./preremove.sh
