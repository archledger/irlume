# Automated dependency-update PRs.
#
# cargo-deny (CI) already fails the build on a known advisory; that is
# detection. This file is remediation: Dependabot opens the PR that actually
# bumps the version. The two are complementary.
#
# Noise control: this repo has ~200 crates.io dependencies, so minor and patch
# bumps are collapsed into one grouped PR per ecosystem per week. Major bumps
# come as their own PR because they can break the build. Dependabot does not
# touch the two git-sourced crates (the tss-esapi fork); those are bumped by
# hand when the fork moves. INVARIANT: this relies on Dependabot's cargo
# ecosystem not updating rev-pinned git deps — keep the fork pinned by exact
# `rev`. Switching it to a `tag`/`branch` would let Dependabot start proposing
# bumps (dependabot-core#10913), and name-based `ignore` does not work for git
# deps (dependabot-core#4388), so the rev pin is the only reliable guard.
version: 2
updates:
  # GitHub Actions across all workflows. Deliberately NOT grouped: the header
  # says every bump is worth seeing because a moved action is a supply-chain
  # event, and a grouped PR would review a possibly-compromised action bump
  # alongside benign ones. Actions are few and change rarely, so per-action
  # PRs cost little noise for a clear per-bump audit trail.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Do not adopt a release the day it appears. A compromised push to a
    # popular action is a real and recent event: Trivy's own action and setup
    # tags were force-pushed to credential-stealing code in March 2026
    # (GHSA-69fq-xp46-6x23). A week of aging means a malicious release has time
    # to be reported and yanked before it is proposed here. This delays version
    # updates only; Dependabot security updates and the daily cargo-deny
    # advisory job are unaffected.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  # Rust crates from crates.io. Two lockfiles: the main workspace and the
  # detached cargo-fuzz workspace (fuzz/Cargo.lock), which cargo-deny at the
  # repo root never audits, so it must not rot silently either.
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same reasoning as the actions ecosystem above. Cargo supports SemVer-aware
    # windows, so a major bump (the likeliest place for a hostile rewrite to
    # hide) ages longer than a patch.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
