# Weekly automation of the install matrix that release prep previously ran by
# hand (docs/PLATFORMS.md): build the universal .deb in its debian:12 container,
# install it on every supported Debian/Ubuntu base and smoke-test the CLI, and
# do a full build+test pass on rolling Arch. A failed scheduled run emails the
# maintainer; the sibling-project lesson behind it is that advertised install
# lanes rot silently unless CI exercises them (a Nix lane elsewhere shipped
# broken twice, found only by user bug reports).
name: Install matrix

on:
  schedule:
    - cron: "45 6 * * 1" # Mondays 06:45 UTC, after the advisory audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: build universal .deb (debian:12, podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reach.
          persist-credentials: false

      # Same model cache as ci.yml (shared key): the ~257 MB weights are
      # fetched from the models-v1 release, cached so warm runs skip the pull.
      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models/SHA256SUMS') }}

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: Build the .deb (packaging/debian/build-deb-container.sh)
        run: bash packaging/debian/build-deb-container.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: irlume-deb
          path: irlume_*_amd64.deb
          if-no-files-found: error
          retention-days: 7

  install-smoke:
    name: install smoke (${{ matrix.image }})
    needs: build-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The bases the universal .deb promises to support (glibc 2.35 floor):
        # oldest Debian, oldest supported Ubuntu LTS, current LTS bases.
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: irlume-deb

      - name: Install on a bare image
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./irlume_*_amd64.deb

      - name: CLI smoke
        run: |
          irlume version
          # detect's contract: 0 = ready, 10 = partial, 20 = absent. A bare
          # container has no camera/TPM, so any of the three is a pass; anything
          # else (a crash, a missing shared library) fails the lane.
          rc=0; irlume detect || rc=$?
          case "$rc" in 0|10|20) echo "detect exit $rc (ok)";;
                        *) echo "unexpected detect exit $rc"; exit 1;; esac

  arch-build-test:
    name: build + test on Arch (rolling toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The CLI fixtures need nested user/network/mount namespaces. Docker's
    # job-container defaults prohibit those operations. Use rootless Podman,
    # as the Debian builder does, retaining its default capabilities and seccomp.
    # Only /proc masks are removed so the kernel permits a nested proc mount;
    # /sys masks remain. No host capabilities or privileged container.
    # Rootless Podman is a different boundary from Docker's AppArmor profile;
    # the full in-container probe below must pass before compiling anything.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models/SHA256SUMS') }}

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: Build and test in rootless Arch
        run: |
          set -euo pipefail
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman version
          podman info --format '{{json .Host.Security}}'
          # Source is read-only. Build/cache/test state stays in the disposable
          # container; no host devices, credentials or runtime sockets are bound.
          # The digest is the same reviewed Arch base as the previous lane.
          # Kernel mount_too_revealing rejects a fresh proc mount when the
          # parent proc has masked children, even inside a new PID namespace.
          # This affects only the rootless container, not the host proc mount.
          podman run --rm --security-opt 'unmask=/proc/*' \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            --env CARGO_TARGET_DIR=/tmp/irlume-arch-target \
            docker.io/library/archlinux@sha256:592e11bd99ab579f933a0cb77a8f66e2f3ae57f5eafacf13aea44a6e98ef21ae \
            bash -euc '
              pacman-key --init
              pacman -Syu --noconfirm --needed \
                base-devel git rust clang pam tpm2-tss curl ca-certificates bubblewrap
              # Permission and permanent-credential-drop tests model a login
              # account. UID 0 bypasses DAC and is deliberately refused as a
              # wallet target. Namespace-root CLI fixtures still run via bwrap.
              useradd --create-home --uid 1000 irlume-test
              runuser -u irlume-test -- git config --global --add safe.directory /src
              cat /proc/self/uid_map
              grep -E "^(CapEff|CapBnd|Seccomp):" /proc/self/status
              if [ -r /proc/self/attr/current ]; then cat /proc/self/attr/current; fi
              runuser -u irlume-test -- bash scripts/ci-bubblewrap.sh --check

              ver=1.28.1
              cd /tmp
              curl -fsSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-${ver}.tgz"
              tar xzf "onnxruntime-linux-x64-${ver}.tgz"
              export ORT_DYLIB_PATH="/tmp/onnxruntime-linux-x64-${ver}/lib/libonnxruntime.so"
              cd /src
              runuser -u irlume-test -- cargo build --workspace --locked
              runuser -u irlume-test -- ./scripts/run-tests-guarded.sh --min 650 \
                --require auth_sensor_and_consent_concurrent_writes_preserve_both_policies,auth_sensor_owner_change_requires_ack_and_preserves_unrelated_settings,selinux_status_classifies_module_state_from_probe_output,credential_verifier_rejects_retained_or_wrong_identity,salt_reader_boundaries_run_in_fresh_processes \
                -- cargo test --workspace --locked
            '
