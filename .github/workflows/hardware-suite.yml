# Nightly hardware-in-the-loop suite on the self-hosted runner (archhost:
# real TPM at /dev/tpmrm0 via the tss group, NexiGo N930W IR camera via the
# video group). This exists because software fakes have proven blind spots:
# the Tier-1 signed-PCR bug passed swtpm-based CI completely and only failed
# on a real TPM, and the camera paths excluded from coverage are exactly the
# ones a loopback device cannot exercise.
#
# SECURITY: this workflow must NEVER gain a pull_request trigger. The runner
# is a personal machine; schedule + manual dispatch from main is the entire
# allowed surface (fork-PR approval is also set to all outside collaborators
# repo-wide, as second line of defense).
name: Hardware suite

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC nightly; if the box is off, the job
      # queues and runs when it wakes (or expires after 24h — an expired run
      # just means the box was off, not a regression)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-suite
  cancel-in-progress: false

jobs:
  hardware:
    name: build · test · real-TPM · IR camera
    # `arch` pins this to archhost deliberately: minihost carries tpm and
    # ir-camera too, and this suite's camera-absent path exits 0, so without
    # the pin the ONLY real-IR-camera lane could land on the other machine
    # and report green having tested no camera at all.
    runs-on: [self-hosted, arch, tpm, ir-camera]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No actions/cache here: on a self-hosted runner the fetched models/
      # (gitignored, so a clean checkout leaves them) persist in the runner work
      # directory between runs, so fetch-models.sh is a no-op after the first
      # run; a round-trip to the Actions cache service would be pure overhead. Incremental build state
      # likewise persists via the runner-level CARGO_TARGET_DIR (set in the
      # runner's .env, outside the work dir so checkout's clean never wipes it).
      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: build (system rust, rolling Arch)
        run: cargo build --workspace --locked

      # Guarded because `cargo test` exits 0 even when it discovers no tests at
      # all. The floor sits well below the real count (707 at 0.7.0).
      - name: test (hardware-independent set)
        run: ./scripts/run-tests-guarded.sh --min 650 -- cargo test --workspace --locked

      # The same named tests ci.yml runs against swtpm, but with NO IRLUME_TCTI
      # override, so they hit the real TPM (device:/dev/tpmrm0, the built-in
      # default). Transient handles + round-trip verification only; validated
      # non-destructive on this hardware during the seal-ladder campaigns.
      # The count assertion this step used to carry now lives in the shared
      # guard, which names the set instead of counting it: renaming one of these
      # while adding another would leave the total at 4 and hide the loss.
      - name: test (TPM-gated, against the REAL TPM)
        run: |
          ./scripts/run-tests-guarded.sh --require seal_unseal_roundtrip_real_tpm,arm_and_unseal_roundtrip,reseal_only_when_stale,tpm_key_and_recovery_lifecycle \
            -- cargo test -p irlume-core --lib --locked -- --ignored \
            seal_unseal_roundtrip_real_tpm arm_and_unseal_roundtrip reseal_only_when_stale \
            tpm_key_and_recovery_lifecycle --test-threads=1

      # Real-camera smoke: find the IR node by the same classifier users run,
      # then capture a strobe burst and require real frames. Skips cleanly when
      # the camera is unplugged (it gets borrowed for the mini-PC OS bench) so
      # a borrowed camera never reads as a red run. Frames stay on the runner
      # and are deleted; they are never uploaded (they picture the room).
      - name: IR camera strobe-burst capture
        run: |
          # Distinguish "camera genuinely absent" from "doctor itself failed":
          # a doctor crash or a changed output format must NOT read as a clean
          # skip (that would let a real regression pass green). Run doctor once,
          # fail loudly if it errors, and only skip when it succeeded AND
          # reported no IR node.
          doc="$(mktemp)"
          # The runner sets CARGO_TARGET_DIR in its .env (outside the work dir,
          # so checkout's clean cannot wipe the incremental build state), which
          # means cargo never writes ./target here. Hardcoding that path made
          # every scheduled run fail on a missing binary while the tests above
          # passed, so resolve the same directory cargo just built into.
          irlume_bin="${CARGO_TARGET_DIR:-target}/debug/irlume"
          if [ ! -x "$irlume_bin" ]; then
            echo "::error::built binary not found at $irlume_bin"
            exit 1
          fi
          if ! "$irlume_bin" doctor >"$doc" 2>&1; then
            echo "::error::irlume doctor failed — not a clean camera-absent skip"
            cat "$doc"; exit 1
          fi
          # An empty result has three very different causes, and the parser
          # that used to live inline here could only express two of them. It
          # read a changed doctor format as "no IR node", so from 2026-08-01
          # every scheduled run failed with "classified 5 camera node(s) but
          # none as Ir" while the doctor output printed directly beneath it
          # said "/dev/video2: Ir (uvcvideo, USB)". Eight nights of the only
          # check that drives the real IR emitter, not run.
          #
          # The parse now lives in a script with a self-test that hosted CI
          # runs on every PR, so the next doctor format change fails in
          # seconds instead of parking this stage until someone reads a log.
          ir=""; rc=0
          ir=$(scripts/ir-node-from-doctor.sh "$doc") || rc=$?
          case "$rc" in
            0) ;;
            10)
              echo "::notice::no camera nodes at all — camera stage skipped (borrowed for the OS bench?)"
              exit 0
              ;;
            11)
              echo "::error::doctor classified camera node(s) but none as Ir on a runner that has one"
              cat "$doc"; exit 1
              ;;
            12)
              echo "::error::doctor output no longer parses — fix scripts/ir-node-from-doctor.sh; this is NOT a missing camera"
              cat "$doc"; exit 1
              ;;
            *)
              echo "::error::scripts/ir-node-from-doctor.sh exited $rc"
              cat "$doc"; exit 1
              ;;
          esac
          echo "IR node: $ir"
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          cargo run -q -p irlume-camera --example burst_dump -- "$out" "$ir" 6
          frames=$(find "$out" -name "frame*.pgm" | wc -l)
          echo "captured $frames frames"
          test "$frames" -ge 4
          # The strobe must actually strobe: require a real spread between the
          # brightest (emitter-lit) and darkest frame means, the same signal
          # capture_ir keys on. A dead emitter shows as a flat, dark burst.
          awk '{print $2}' "$out/means.txt" | sort -n | awk 'NR==1{min=$1} END{max=$1; d=max-min; printf "mean spread: %.1f\n", d; exit (d < 5)}'

      # Forensics on failure only. A hardware-only failure is otherwise
      # reconstructed by reading raw job logs and guessing at machine state that
      # has since changed: the first diagnosis of the CARGO_TARGET_DIR breakage
      # in this very job started from a wrong hypothesis (that the runner was
      # offline) because none of this was captured.
      #
      # Everything is best-effort and must never mask the real failure, so each
      # command swallows its own error and the step force-succeeds. Scoped
      # deliberately: the irlumed unit journal and kernel ring rather than the
      # whole system journal, because this runner is a personal machine.
      - name: Collect failure forensics
        if: failure()
        continue-on-error: true
        run: |
          set +e
          out=hw-forensics
          mkdir -p "$out"

          {
            echo "commit:  ${GITHUB_SHA}"
            echo "run:     ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "runner:  $(uname -a)"
            echo "rustc:   $(rustc -vV 2>&1 | tr '\n' ' ')"
            echo "target:  ${CARGO_TARGET_DIR:-target}"
          } > "$out/context.txt" 2>&1

          # Cameras: which nodes exist, what formats they claim, and whether the
          # loopback module is loaded. "no IR camera" and "IR camera wedged" look
          # identical in the job log without this.
          {
            ls -l /dev/video* /dev/media* 2>&1
            # WHO holds the nodes, recorded BEFORE anything below opens them.
            # The format probe below is itself an opener, so on a strict UVC
            # module it can report EBUSY that it caused; this line says whether
            # irlumed already had the node, which is the difference between "the
            # camera is wedged" and "the daemon was mid-capture" (#187).
            echo "--- holders ---"; fuser -v /dev/video* 2>&1 || echo "(none)"
            echo "--- v4l2 devices ---"; v4l2-ctl --list-devices 2>&1
            for d in /dev/video*; do
              echo "--- $d formats ---"; v4l2-ctl -d "$d" --list-formats-ext 2>&1
            done
            echo "--- usb ---"; lsusb 2>&1
            echo "--- v4l2loopback ---"; lsmod 2>&1 | grep -i v4l2 || echo "(module not loaded)"
          } > "$out/cameras.txt" 2>&1

          # TPM: presence and permissions. A tss-group or device-permission
          # change is invisible in a "test failed" line.
          { ls -l /dev/tpm* 2>&1; echo "--- groups ---"; id 2>&1; } > "$out/tpm.txt" 2>&1

          # dmesg is root-only here (kernel.dmesg_restrict=1), but the journal is
          # readable by the runner user, so take the kernel ring through it.
          journalctl -k --since "-30 min" --no-pager > "$out/kernel.log" 2>&1
          journalctl -u irlumed --since "-30 min" --no-pager > "$out/irlumed.log" 2>&1
          coredumpctl list --no-pager > "$out/coredumps.txt" 2>&1

          # Bound the bundle: a runaway log must not turn a failed run into a
          # multi-gigabyte upload.
          find "$out" -type f -size +5M -exec truncate -s 5M {} \;
          ls -la "$out"

      - name: Upload failure forensics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw-forensics/
          if-no-files-found: warn
          # Short: this is debugging material from a personal machine, not an
          # artifact anyone should be able to fetch weeks later.
          retention-days: 7

  # Hardware-inclusive statement coverage: the same measurement the hosted
  # ratchet takes, but with the TPM-gated tests on REAL silicon and the
  # camera/PAM matrices included. Report-only (no floor): the number feeds
  # the OpenSSF Best Practices gold criterion (test_statement_coverage90),
  # and the delta against the hosted number shows which hardware-only paths
  # remain unreached. Runs after the smoke job so the two never contend for
  # the camera.
  coverage:
    name: coverage (hardware-inclusive, report only)
    needs: hardware
    # `arch` pins this to archhost deliberately: minihost carries tpm and
    # ir-camera too, and this suite's camera-absent path exits 0, so without
    # the pin the ONLY real-IR-camera lane could land on the other machine
    # and report green having tested no camera at all.
    runs-on: [self-hosted, arch, tpm, ir-camera]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: Coverage (workspace + real-TPM + loopback cameras + PAM FFI)
        env:
          IRLUME_TEST_RGB_DEVICE: /dev/video8
          IRLUME_TEST_IR_DEVICE: /dev/video9
          IRLUME_TEST_SPARE_DEVICE: /dev/video10
          IRLUME_TEST_ALLOW_VIRTUAL_CAMERA: /dev/video8,/dev/video9
        run: |
          if [ ! -w /dev/video8 ] || [ ! -w /dev/video9 ]; then
            echo "::error::loopback nodes missing — re-provision v4l2loopback"
            exit 1
          fi
          ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x480:rate=30 -pix_fmt yuyv422 -f v4l2 /dev/video8 >/dev/null 2>&1 &
          ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x400:rate=30 -pix_fmt gray -f v4l2 /dev/video9 >/dev/null 2>&1 &
          trap 'kill %1 %2 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            if [ -r /dev/video8 ] && [ -r /dev/video9 ]; then break; fi
            sleep 1
          done
          # Each selection is guarded separately. Guarding the step as a whole
          # would let the workspace run satisfy the minimum for every filtered
          # lane after it, which is the failure being guarded against.
          ./scripts/run-tests-guarded.sh --min 650 -- cargo llvm-cov --no-report --workspace --locked
          ./scripts/run-tests-guarded.sh --require seal_unseal_roundtrip_real_tpm,arm_and_unseal_roundtrip,reseal_only_when_stale,tpm_key_and_recovery_lifecycle,tpm_tampered_seal_falls_back_then_recovery_heals,seal_unseal_pcrlock_roundtrip_provisioned_nv \
            -- cargo llvm-cov --no-report -p irlume-core --lib --locked -- --ignored \
            seal_unseal_roundtrip_real_tpm arm_and_unseal_roundtrip reseal_only_when_stale \
            tpm_key_and_recovery_lifecycle tpm_tampered_seal_falls_back_then_recovery_heals seal_unseal_pcrlock_roundtrip_provisioned_nv --test-threads=1
          ./scripts/run-tests-guarded.sh --min 15 -- cargo llvm-cov --no-report -p irlume-camera -p irlume-auth -p irlume-daemon --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 7 -- cargo llvm-cov --no-report -p irlume-cli --test cli_capture --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 5 -- cargo llvm-cov --no-report -p irlume-cli --test cli_bench --locked -- --ignored bench_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 1 -- cargo llvm-cov --no-report -p irlume-daemon --test shutdown --locked -- --ignored --test-threads=1
          ./scripts/run-tests-guarded.sh --min 16 -- cargo llvm-cov --no-report -p irlume-pam --locked -- --include-ignored --test-threads=1
          cargo llvm-cov report --summary-only
