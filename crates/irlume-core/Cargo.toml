[package]
name = "irlume-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The cross-crate test seams (template_key::test_support): a dependent crate's
# test binary enables this from dev-dependencies to pin what `tpm_available()`
# answers. Resolver 2 keeps it out of release builds, so no production binary
# ships the override.
test-support = []

[dependencies]
irlume-common.workspace = true
irlume-vision.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tss-esapi.workspace = true
base64.workspace = true
sha2.workspace = true
der.workspace = true
spki.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
pbkdf2.workspace = true
# O_NONBLOCK/O_NOFOLLOW when reading a file inside a user-writable home.
libc.workspace = true
rand.workspace = true

[lints]
workspace = true
