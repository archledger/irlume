# Format, lint, build, and test on every push / PR to main.
#
# Mirrors the Ubuntu path in docs/DEVELOPMENT.md and pins Rust to the project
# MSRV (1.88, the ort / edition-2024 floor), so CI matches `nix develop` and a
# contributor who follows the developer guide gets the same result CI does.
name: CI

# SECURITY: push-trigger only, the preflight.yml pattern. All jobs run on
# the self-hosted runner, and a pull_request run executes the workflow file
# from the PR head, so a fork PR could edit its way onto the personal
# machine. A push can only come from someone with push access; same-repo
# branches (and therefore same-repo PRs) get every required check from the
# push run. Fork PRs get no checks and need a maintainer-pushed branch.
on:
  push:
    branches: ["**"]

# Least privilege for GITHUB_TOKEN: this workflow only reads the repo
# (checkout + LFS); nothing here publishes or writes.
permissions:
  contents: read

# A newer push cancels the in-flight run on PRs only. On main every push
# keeps its run: two pushes in quick succession otherwise leave the first
# commit with cancelled (never-completed) checks, which once let a merge
# commit land on main untested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runner routing: heavy jobs (build, test, coverage, fuzz, nix) stay on
# `arch`, which only the Ryzen carries. The two light jobs take the
# shared `ci` label, so either machine can run them and neither is a
# single point of failure for a REQUIRED check. The N100 never sees a
# release build.
#
# Branch protection on `main` requires these SEVEN job names as status checks,
# verified against the live ruleset 2026-08-07:
#   "fmt · clippy · build · test"
#   "test (stable)"
#   "coverage (line-coverage ratchet)"
#   "fuzz (untrusted-input parsers)"
#   "cargo-deny (advisories · licenses · duplicate versions)"
#   "systemd units (verify + exposure ratchet)"
#   "nix flake check"
# Renaming a job below without updating the protection rule leaves a PR waiting
# on a check that never reports, so it can never merge. Change both together.
# Five of the seven can only run on `arch` (archhost); the two on the shared
# `ci` label can run on either machine.
jobs:
  check:
    name: fmt · clippy · build · test
    runs-on: [self-hosted, arch]
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit SHA (the tag in the comment is what it
      # was) so a moved tag cannot change what runs. Dependabot bumps these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reach.
          persist-credentials: false

      # The ONNX weights (~257 MB) are fetched from the models-v1 release, not
      # Git LFS; cache them keyed on models/SHA256SUMS (changes exactly when the
      # weights do) so a warm run skips the download (fetch-models.sh verifies
      # the cached copies and no-ops).
      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models/SHA256SUMS') }}

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: Install system build dependencies
        run: |
          # Self-hosted Arch runner: the toolchain deps are preinstalled
          # (base-devel, clang, pam, tpm2-tss); apt path kept for any future
          # hosted fallback.
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config clang libclang-dev libpam0g-dev libtss2-dev
          else
            for t in cc pkg-config clang; do command -v "$t" >/dev/null || { echo "::error::$t missing on the runner"; exit 1; }; done
          fi

      - name: Install Rust 1.88 (MSRV) with rustfmt + clippy
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          # Pinned to a SHA, the action can't read the version from the tag, so
          # name the toolchain explicitly (it is a required input then).
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # PRs RESTORE from main's cache but never SAVE their own: per-PR
          # entries were filling the repo's 10 GB cache quota, and LRU
          # eviction would eventually knock out the LFS model cache that
          # guards the (scarcer) LFS bandwidth quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch the ONNX runtime (ort loads it dynamically at runtime)
        run: |
          ver=1.24.4
          curl -fsSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-${ver}.tgz"
          tar xzf "onnxruntime-linux-x64-${ver}.tgz"
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime-linux-x64-${ver}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Action pins (SHA-pinned; SLSA generator excepted)
        run: bash scripts/check-action-pins.sh

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: doc (broken intra-doc links are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: build
        run: cargo build --release --locked

      # Guarded because `cargo test` exits 0 even when it discovers no tests at
      # all. The floor sits well below the real count (707 at 0.7.0), so it
      # catches a collapse in discovery without churning as tests are added.
      - name: test
        run: ./scripts/run-tests-guarded.sh --min 650 -- cargo test --workspace --locked

      # The machine API is a promise to other people's software, so it is
      # checked the way a consumer would check it: run the release binary and
      # validate what it actually writes against the published schema, rather
      # than trusting a unit test over the same code that produced the output.
      # --strict additionally fails on properties the schema does not describe;
      # adding a field is allowed within a contract, but it should be a decision
      # rather than a surprise, so it fails here until the schema documents it.
      - name: machine API conformance (real binary against the published schema)
        run: |
          command -v apt-get >/dev/null && sudo apt-get install -y --no-install-recommends python3-jsonschema || python3 -c "import jsonschema"
          python3 scripts/machine-api-conformance.py \
            --irlume "${CARGO_TARGET_DIR:-target}/release/irlume" --strict

      # The TPM-gated tests run against a software TPM: same TSS stack, no
      # hardware. IRLUME_TCTI is the production env override; swtpm state is
      # throwaway per run.
      - name: Start swtpm (software TPM)
        run: |
          command -v swtpm >/dev/null || sudo apt-get install -y --no-install-recommends swtpm libtss2-tcti-swtpm0
          mkdir -p /tmp/swtpm
          swtpm socket --tpm2 --tpmstate dir=/tmp/swtpm \
            --server type=tcp,port=2321,disconnect --ctrl type=tcp,port=2322 \
            --flags not-need-init,startup-clear --daemon --pid file=/tmp/swtpm/pid

      # --require names the set rather than counting it: renaming one of these
      # while adding another would leave the total intact and hide the loss.
      - name: test (TPM-gated, against swtpm)
        env:
          IRLUME_TCTI: swtpm:host=127.0.0.1,port=2321
        run: |
          ./scripts/run-tests-guarded.sh --require seal_unseal_roundtrip_real_tpm,arm_and_unseal_roundtrip,reseal_only_when_stale,tpm_key_and_recovery_lifecycle,tpm_tampered_seal_falls_back_then_recovery_heals,seal_unseal_pcrlock_roundtrip_provisioned_nv \
            -- cargo test -p irlume-core --lib --locked -- --ignored \
            seal_unseal_roundtrip_real_tpm arm_and_unseal_roundtrip reseal_only_when_stale tpm_key_and_recovery_lifecycle tpm_tampered_seal_falls_back_then_recovery_heals seal_unseal_pcrlock_roundtrip_provisioned_nv --test-threads=1
          ./scripts/run-tests-guarded.sh --min 1 \
            -- cargo test -p irlume-daemon --locked -- --ignored tpm_ --test-threads=1

      # Virtual cameras: v4l2loopback provides the V4L2 nodes, ffmpeg feeds
      # test patterns in the exact formats the capture paths negotiate
      # (YUYV 640x480 for RGB, GREY 640x400 for IR). Same idea as swtpm:
      # fake hardware, real code.
      # The swtpm set above proves the code path; this proves it against the
      # REAL chip (device:/dev/tpmrm0, the built-in default; the runner user
      # is in the tss group). Absorbed from preflight.yml, whose only unique
      # coverage this was, when that duplicate lane was deleted. The guard
      # NAMES the set instead of counting it: renaming one while adding
      # another would leave the total at six and hide the loss.
      - name: test (TPM-gated, against the REAL TPM)
        run: |
          # seal_unseal_pcrlock_roundtrip_provisioned_nv is DELIBERATELY not in
          # this set: it hard-codes NV index 0x0181C0DE and undefines whatever
          # already lives there without checking who created it. Against swtpm
          # (the step above) that state is disposable; against the real chip it
          # would destroy persistent hardware state this test never owned, and
          # an interrupted run leaves the fixture installed for the next one to
          # delete. Its pcrlock coverage runs on swtpm.
          ./scripts/run-tests-guarded.sh --require seal_unseal_roundtrip_real_tpm,arm_and_unseal_roundtrip,reseal_only_when_stale,tpm_key_and_recovery_lifecycle,tpm_tampered_seal_falls_back_then_recovery_heals \
            -- cargo test -p irlume-core --lib --locked -- --ignored \
            seal_unseal_roundtrip_real_tpm arm_and_unseal_roundtrip reseal_only_when_stale \
            tpm_key_and_recovery_lifecycle tpm_tampered_seal_falls_back_then_recovery_heals \
            --test-threads=1
        env:
          IRLUME_TCTI: device:/dev/tpmrm0

      - name: Start virtual cameras (v4l2loopback + ffmpeg feeders)
        run: |
          # Ubuntu's packaged v4l2loopback (0.12.x) predates this runner
          # kernel's V4L2 API and fails to load; build upstream at a pinned
          # commit instead. videodev (its dependency) lives in modules-extra.
          # v4l2loopback (built from a pinned upstream commit because Ubuntu's
          # 0.12.x won't load on the runner kernel) plus pam_wrapper/pamtester
          # for the PAM FFI tests. video8/9 are fed by ffmpeg; video10 is a
          # spare the camera streaming tests feed themselves.
          # The self-hosted runner provisions video8/9/10 persistently
          # (v4l2loopback-dkms + modules-load.d + a udev rule granting group
          # video); build-from-source only on a runner without them.
          if [ ! -e /dev/video8 ]; then
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)" ffmpeg libpam-wrapper pamtester
          git clone https://github.com/v4l2loopback/v4l2loopback /tmp/v4l2loopback
          git -C /tmp/v4l2loopback checkout 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4 # v0.15.4
          make -C /tmp/v4l2loopback -j"$(nproc)"
          sudo modprobe videodev
          sudo insmod /tmp/v4l2loopback/v4l2loopback.ko devices=3 video_nr=8,9,10 exclusive_caps=0
          # Let udev finish applying its default (root:video 0660) perms BEFORE
          # our chmod, otherwise a late udev event overrides it and a test opens
          # the node with EACCES ("permission denied"), an intermittent flake.
          sudo udevadm settle
          sudo chmod 666 /dev/video8 /dev/video9 /dev/video10
          fi
          nohup ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x480:rate=30 -pix_fmt yuyv422 -f v4l2 /dev/video8 >/dev/null 2>&1 &
          rgb_pid=$!
          nohup ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x400:rate=30 -pix_fmt gray -f v4l2 /dev/video9 >/dev/null 2>&1 &
          ir_pid=$!
          # Wait for FRAMES, not for a readable inode: the nodes are chmod 666
          # before the feeders start, so the old `[ -r ... ]` poll always
          # succeeded on the first iteration and verified nothing. ffmpeg
          # reading one frame is the only proof the feeder is actually
          # producing. A dead feeder is a hard failure, not a slow start.
          ready=0
          for _ in $(seq 1 20); do
            sudo chmod 666 /dev/video8 /dev/video9 /dev/video10 2>/dev/null || true
            if ffmpeg -loglevel quiet -f v4l2 -i /dev/video8 -frames:v 1 -f null - 2>/dev/null \
               && ffmpeg -loglevel quiet -f v4l2 -i /dev/video9 -frames:v 1 -f null - 2>/dev/null; then
              ready=1; break
            fi
            for fp in "$rgb_pid:RGB" "$ir_pid:IR"; do
              if ! kill -0 "${fp%%:*}" 2>/dev/null; then
                echo "::error::the ${fp##*:} feeder died before producing a frame"; exit 1
              fi
            done
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::virtual cameras never produced a frame"; exit 1; }
          ls -l /dev/video8 /dev/video9 /dev/video10

      - name: test (camera + capture paths, against v4l2loopback)
        env:
          IRLUME_TEST_RGB_DEVICE: /dev/video8
          IRLUME_TEST_IR_DEVICE: /dev/video9
          IRLUME_TEST_SPARE_DEVICE: /dev/video10
          # Loopback nodes have no physical bus; the exact-path escape lets
          # verify_pinned accept just these (see THREAT_MODEL.md).
          IRLUME_TEST_ALLOW_VIRTUAL_CAMERA: /dev/video8,/dev/video9
        run: |
          ./scripts/run-tests-guarded.sh --min 15 -- cargo test -p irlume-camera -p irlume-auth -p irlume-daemon --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 7 -- cargo test -p irlume-cli --test cli_capture --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 5 -- cargo test -p irlume-cli --test cli_bench --locked -- --ignored bench_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 1 -- cargo test -p irlume-daemon --test shutdown --locked -- --ignored --test-threads=1

      - name: test (PAM FFI, against pam_wrapper)
        run: ./scripts/run-tests-guarded.sh --min 16 -- cargo test -p irlume-pam --locked -- --include-ignored --test-threads=1

  # Build + test on current stable, because that is what the packaging lanes
  # and most from-source users compile with. fmt/clippy stay on the MSRV job
  # only, so new-stable lint churn never blocks a PR. REQUIRED (see the seven-check list in the header).
  stable:
    name: test (stable)
    runs-on: [self-hosted, arch]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reach.
          persist-credentials: false

      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models/SHA256SUMS') }}

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: Install system build dependencies
        run: |
          # Self-hosted Arch runner: the toolchain deps are preinstalled
          # (base-devel, clang, pam, tpm2-tss); apt path kept for any future
          # hosted fallback.
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config clang libclang-dev libpam0g-dev libtss2-dev
          else
            for t in cc pkg-config clang; do command -v "$t" >/dev/null || { echo "::error::$t missing on the runner"; exit 1; }; done
          fi

      - name: Install stable Rust
        # @master (declares the `toolchain` input); the version tag branches
        # (e.g. @1.88.0) have no such input and ignore `with: toolchain:`.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # PRs RESTORE from main's cache but never SAVE their own: per-PR
          # entries were filling the repo's 10 GB cache quota, and LRU
          # eviction would eventually knock out the LFS model cache that
          # guards the (scarcer) LFS bandwidth quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch the ONNX runtime (ort loads it dynamically at runtime)
        run: |
          ver=1.24.4
          curl -fsSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-${ver}.tgz"
          tar xzf "onnxruntime-linux-x64-${ver}.tgz"
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime-linux-x64-${ver}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: build
        run: cargo build --release --locked

      # Guarded because `cargo test` exits 0 even when it discovers no tests at
      # all. The floor sits well below the real count (707 at 0.7.0), so it
      # catches a collapse in discovery without churning as tests are added.
      - name: test
        run: ./scripts/run-tests-guarded.sh --min 650 -- cargo test --workspace --locked

  # Statement coverage with a ratchet: the build fails if line coverage drops
  # below the floor. The floor moves up as tests are added, never down
  # (OpenSSF silver test_statement_coverage80 is the long-term target).
  # REQUIRED (see the seven-check list in the header).
  coverage:
    name: coverage (line-coverage ratchet)
    runs-on: [self-hosted, arch]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reach.
          persist-credentials: false

      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('models/SHA256SUMS') }}

      - name: Fetch model weights (models-v1 release, sha256-verified)
        run: bash scripts/fetch-models.sh

      - name: Install system build dependencies
        run: |
          # Self-hosted Arch runner: the toolchain deps are preinstalled
          # (base-devel, clang, pam, tpm2-tss); apt path kept for any future
          # hosted fallback.
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config clang libclang-dev libpam0g-dev libtss2-dev
          else
            for t in cc pkg-config clang; do command -v "$t" >/dev/null || { echo "::error::$t missing on the runner"; exit 1; }; done
          fi

      - name: Install stable Rust with llvm-tools
        # @master (declares the `toolchain` input); the version tag branches
        # (e.g. @1.88.0) have no such input and ignore `with: toolchain:`.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # PRs RESTORE from main's cache but never SAVE their own: per-PR
          # entries were filling the repo's 10 GB cache quota, and LRU
          # eviction would eventually knock out the LFS model cache that
          # guards the (scarcer) LFS bandwidth quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        # Idempotent on a persistent runner: `cargo install` refuses when the
        # binary already exists, so only (re)install on a version mismatch.
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -q '0\.8\.7'; then
            cargo install cargo-llvm-cov --version 0.8.7 --locked --force
          fi

      - name: Fetch the ONNX runtime (ort loads it dynamically at runtime)
        run: |
          ver=1.24.4
          curl -fsSLO "https://github.com/microsoft/onnxruntime/releases/download/v${ver}/onnxruntime-linux-x64-${ver}.tgz"
          tar xzf "onnxruntime-linux-x64-${ver}.tgz"
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime-linux-x64-${ver}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Start swtpm (software TPM)
        run: |
          command -v swtpm >/dev/null || sudo apt-get install -y --no-install-recommends swtpm libtss2-tcti-swtpm0
          mkdir -p /tmp/swtpm
          swtpm socket --tpm2 --tpmstate dir=/tmp/swtpm \
            --server type=tcp,port=2321,disconnect --ctrl type=tcp,port=2322 \
            --flags not-need-init,startup-clear --daemon --pid file=/tmp/swtpm/pid

      - name: Start virtual cameras (v4l2loopback + ffmpeg feeders)
        run: |
          # Ubuntu's packaged v4l2loopback (0.12.x) predates this runner
          # kernel's V4L2 API and fails to load; build upstream at a pinned
          # commit instead. videodev (its dependency) lives in modules-extra.
          # v4l2loopback (built from a pinned upstream commit because Ubuntu's
          # 0.12.x won't load on the runner kernel) plus pam_wrapper/pamtester
          # for the PAM FFI tests. video8/9 are fed by ffmpeg; video10 is a
          # spare the camera streaming tests feed themselves.
          # The self-hosted runner provisions video8/9/10 persistently
          # (v4l2loopback-dkms + modules-load.d + a udev rule granting group
          # video); build-from-source only on a runner without them.
          if [ ! -e /dev/video8 ]; then
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)" "linux-modules-extra-$(uname -r)" ffmpeg libpam-wrapper pamtester
          git clone https://github.com/v4l2loopback/v4l2loopback /tmp/v4l2loopback
          git -C /tmp/v4l2loopback checkout 0f9ee86760b7f2bea174b7e3e7a1d38845da0ab4 # v0.15.4
          make -C /tmp/v4l2loopback -j"$(nproc)"
          sudo modprobe videodev
          sudo insmod /tmp/v4l2loopback/v4l2loopback.ko devices=3 video_nr=8,9,10 exclusive_caps=0
          # Let udev finish applying its default (root:video 0660) perms BEFORE
          # our chmod, otherwise a late udev event overrides it and a test opens
          # the node with EACCES ("permission denied"), an intermittent flake.
          sudo udevadm settle
          sudo chmod 666 /dev/video8 /dev/video9 /dev/video10
          fi
          nohup ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x480:rate=30 -pix_fmt yuyv422 -f v4l2 /dev/video8 >/dev/null 2>&1 &
          rgb_pid=$!
          nohup ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x400:rate=30 -pix_fmt gray -f v4l2 /dev/video9 >/dev/null 2>&1 &
          ir_pid=$!
          # Wait for FRAMES, not for a readable inode: the nodes are chmod 666
          # before the feeders start, so the old `[ -r ... ]` poll always
          # succeeded on the first iteration and verified nothing. ffmpeg
          # reading one frame is the only proof the feeder is actually
          # producing. A dead feeder is a hard failure, not a slow start.
          ready=0
          for _ in $(seq 1 20); do
            sudo chmod 666 /dev/video8 /dev/video9 /dev/video10 2>/dev/null || true
            if ffmpeg -loglevel quiet -f v4l2 -i /dev/video8 -frames:v 1 -f null - 2>/dev/null \
               && ffmpeg -loglevel quiet -f v4l2 -i /dev/video9 -frames:v 1 -f null - 2>/dev/null; then
              ready=1; break
            fi
            for fp in "$rgb_pid:RGB" "$ir_pid:IR"; do
              if ! kill -0 "${fp%%:*}" 2>/dev/null; then
                echo "::error::the ${fp##*:} feeder died before producing a frame"; exit 1
              fi
            done
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::virtual cameras never produced a frame"; exit 1; }
          ls -l /dev/video8 /dev/video9 /dev/video10

      - name: Coverage incl. TPM-gated and camera tests (fail under the ratchet floor)
        env:
          IRLUME_TEST_RGB_DEVICE: /dev/video8
          IRLUME_TEST_IR_DEVICE: /dev/video9
          IRLUME_TEST_SPARE_DEVICE: /dev/video10
          # Loopback nodes have no physical bus; the exact-path escape lets
          # verify_pinned accept just these (see THREAT_MODEL.md).
          IRLUME_TEST_ALLOW_VIRTUAL_CAMERA: /dev/video8,/dev/video9
        run: |
          # Discard any .profraw restored in target/ by rust-cache before the
          # first --no-report, so a prior build's coverage can't contaminate
          # this run's merged report.
          cargo llvm-cov clean --workspace
          # Each selection is guarded separately. Guarding the step as a whole
          # would let the 707-test workspace run satisfy the minimum for every
          # filtered lane after it, which is the failure being guarded against.
          # A lane that silently stops running also drags coverage down and
          # invites the floor below to be lowered to accommodate it.
          ./scripts/run-tests-guarded.sh --min 650 -- cargo llvm-cov --no-report --workspace --locked
          IRLUME_TCTI="swtpm:host=127.0.0.1,port=2321" ./scripts/run-tests-guarded.sh --require seal_unseal_roundtrip_real_tpm,arm_and_unseal_roundtrip,reseal_only_when_stale,tpm_key_and_recovery_lifecycle,tpm_tampered_seal_falls_back_then_recovery_heals,seal_unseal_pcrlock_roundtrip_provisioned_nv \
            -- cargo llvm-cov --no-report -p irlume-core --lib --locked -- --ignored \
            seal_unseal_roundtrip_real_tpm arm_and_unseal_roundtrip reseal_only_when_stale tpm_key_and_recovery_lifecycle tpm_tampered_seal_falls_back_then_recovery_heals seal_unseal_pcrlock_roundtrip_provisioned_nv --test-threads=1
          IRLUME_TCTI="swtpm:host=127.0.0.1,port=2321" ./scripts/run-tests-guarded.sh --min 1 -- cargo llvm-cov --no-report -p irlume-daemon --locked -- --ignored tpm_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 15 -- cargo llvm-cov --no-report -p irlume-camera -p irlume-auth -p irlume-daemon --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 7 -- cargo llvm-cov --no-report -p irlume-cli --test cli_capture --locked -- --ignored loopback_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 5 -- cargo llvm-cov --no-report -p irlume-cli --test cli_bench --locked -- --ignored bench_ --test-threads=1
          ./scripts/run-tests-guarded.sh --min 1 -- cargo llvm-cov --no-report -p irlume-daemon --test shutdown --locked -- --ignored --test-threads=1
          ./scripts/run-tests-guarded.sh --min 16 -- cargo llvm-cov --no-report -p irlume-pam --locked -- --include-ignored --test-threads=1
          # Floor lowered 79 -> 78 (consent-gesture release) -> 77 (0.6.0) -> 76
          # (0.6.1 update-resilience): more self-heal paths that only run against
          # a live system join the earlier ones (secure_getenv socket resolution,
          # active-greeter reconcile check, root-only marker). The 0.6.1 additions
          # are the marker-migration reconcile branch (hardcoded /etc/pam.d), the
          # unrecognized-DM doctor warning, the SetCameras identity persistence,
          # and the camera identity re-anchor (sysfs vid:pid reads): validated on
          # real hardware and in the podman reconcile test, not by unit tests (no
          # mock-camera / no-setuid-context harness). Re-ratchet upward once those
          # paths gain a loopback/mock/integration harness (tracked for a later
          # release).
          cargo llvm-cov report --summary-only --fail-under-lines 76

  deny:
    name: cargo-deny (advisories · licenses · duplicate versions)
    runs-on: [self-hosted, ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  units:
    name: systemd units (verify + exposure ratchet)
    runs-on: [self-hosted, ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every unit in packaging/systemd must be shipped by every packaging lane,
      # and every lane must agree on the version. Both failures have shipped
      # before: the 0.6.x rpm installed a timer it left out of %files, PR #98
      # existed to resync drifted version fields, and the 0.7.0 audit found the
      # PPA lane missing the reconcile timer entirely.
      - name: packaging parity (units in every lane, versions agree)
        run: ./scripts/check-packaging-parity.sh

      # Nothing validated the AppArmor profiles until 0.9.0, and they are the
      # only confinement on the Debian/Ubuntu lane. A profile that fails to
      # parse does not confine, and the two bugs this release fixed (a missing
      # pcrlock rule that broke every Tier 2 unseal, and a granted-vs-denied
      # capability) both live in these files. -Q parses without loading into the
      # kernel and -K skips the policy cache, which together let this run
      # unprivileged: -Q alone still writes /var/cache/apparmor and dies on
      # permission, which is how the first version of this step failed.
      - name: apparmor profiles parse
        run: |
          set -euo pipefail
          command -v apparmor_parser >/dev/null || { sudo apt-get -qq update && sudo apt-get -qq install -y apparmor; }
          for f in packaging/apparmor/*; do
            echo "checking $f on the runner's parser"
            apparmor_parser -QK "$f"
          done

      # The runner's parser is 4.x. The universal .deb declares
      # libc6 (>= 2.35) so it installs on Debian 12 and Ubuntu 22.04, whose
      # apparmor is 3.0.x, and a profile can parse here and fail there: an
      # `abi <abi/4.0>` line did exactly that, and since the postinstall did not
      # report the failure, those installs ran unconfined with nothing said.
      # Check the OLDEST supported parser too, in the distro that ships it.
      - name: apparmor profiles parse on the oldest supported parser
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/packaging/apparmor:/p:ro" ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get -qq update >/dev/null
            apt-get -qq install -y apparmor >/dev/null
            apparmor_parser --version
            useradd -m checker
            for f in /p/*; do
              echo "checking $f"
              su checker -c "apparmor_parser -QK $f"
            done'

      # The guard that stops a zero-match test filter from reporting success is
      # itself a parser, so it gets the same treatment it enforces: prove it can
      # still tell a real run from an empty one. Fixtures only, no Rust build.
      - name: test-count guard self-test
        run: ./scripts/run-tests-guarded.sh --self-test

      # The PPA publish check decides whether a release reached Ubuntu users, so
      # its verdict logic is worth pinning. The live check needs a real upload
      # and cannot run here; --self-test is fixtures only, no network.
      - name: PPA publish verifier (verdict logic)
        run: python3 scripts/verify-ppa-publish.py --self-test

      - name: systemd-analyze verify (unit syntax)
        run: |
          set -euo pipefail
          command -v systemd-analyze >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq systemd; }
          # verify resolves ExecStart and fails on a binary that is not present,
          # which on a build runner it never is. Stub the two paths so the check
          # is about unit syntax, which is what we actually want tested.
          # Stub ONLY when absent: this runner has a real irlume install,
          # and the hosted job's unconditional stub would overwrite it.
          [ -e /usr/bin/irlumed ] || sudo install -Dm755 /bin/true /usr/bin/irlumed
          [ -e /usr/bin/irlume ] || sudo install -Dm755 /bin/true /usr/bin/irlume
          for u in packaging/systemd/*.service packaging/systemd/*.timer packaging/systemd/*.path; do
            echo "::group::verify $(basename "$u")"
            systemd-analyze verify "$u"
            echo "::endgroup::"
          done

      - name: systemd-analyze security (exposure must not regress)
        run: |
          set -euo pipefail
          # Ratchet, in the same spirit as the coverage floor. These numbers are
          # the CURRENT measured exposure, so any change that loosens sandboxing
          # fails here instead of shipping quietly. --threshold compares on a
          # 0-100 scale, so 3.7 as displayed is 37 here, and it fails only when
          # exposure goes OVER the number.
          #
          # To re-baseline deliberately: run
          #   systemd-analyze security --offline=true packaging/systemd/<unit>
          # and move the number, in the same commit as whatever changed it.
          #
          # The score is systemd-version-sensitive. Measured on the ubuntu-24.04
          # image (systemd 255); a runner image that moves to a systemd with new
          # checks may need a re-baseline, which is a deliberate act, not a
          # silent drift.
          # Re-measured 2026-08-06 on the self-hosted runner's systemd 261:
          # identical scores (3.7 / 9.4), so the thresholds carry over.
          #
          # irlume-reconcile.service is knowingly high: it is a root oneshot that
          # rewrites /etc/pam.d, so it holds broad access by design. Locking it
          # here stops it getting worse. Hardening it is its own change, with its
          # own validation, because it is the self-heal that repairs broken PAM.
          fail=0
          check() {
            local unit="$1" threshold="$2"
            echo "::group::security $(basename "$unit") (threshold ${threshold})"
            if systemd-analyze security --offline=true --threshold="$threshold" "$unit"; then
              echo "OK: at or below the recorded exposure"
            else
              echo "::error::$(basename "$unit") exposure rose above ${threshold} (0-100 scale)"
              fail=1
            fi
            echo "::endgroup::"
          }
          check packaging/systemd/irlumed.service 37
          check packaging/systemd/irlume-reconcile.service 94
          exit "$fail"

  nix:
    name: nix flake check
    runs-on: [self-hosted, arch]
    timeout-minutes: 60
    steps:
      # No model fetch here: flake check --no-build only evaluates the outputs
      # (flake structure, the package derivation, the NixOS module, the dev
      # shell); it never reads the ONNX model contents, so a checkout without
      # the weights (they are fetched by the build, not committed) is enough
      # and the job stays fast.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nix is provisioned on the runner (pacman nix, daemon, flakes)
        run: nix --version

      # Evaluates packages.default, nixosModules.irlume, and the dev shell.
      # Catches eval and type errors in flake.nix and nix/*.nix before merge.
      - name: nix flake check
        run: nix flake check --no-build --show-trace

      # --no-build skips fixed-output derivations, so a stale vendor hash
      # (tss-esapi fork pin bump without a nix/package.nix hash update broke
      # `nix build` once while this job stayed green) or a stale ORT hash
      # passes eval. Realizing just the FODs fetches against the recorded
      # hashes and fails on exactly that class of bug, without building the
      # workspace.
      # ACTUALLY BUILD IT. This job used to stop at eval, on the reasoning that
      # the source build was "covered by `nix build` locally", which meant
      # nobody ran it: 0.9.0 was cut with `nix build` failing at the irlumed
      # link step with "cannot find -lcrypt", because nixpkgs stopped providing
      # libcrypt transitively and the daemon declares #[link(name = "crypt")].
      # Eval passed on that same tree, and the RPM and deb lanes cannot see a
      # Nix derivation's buildInputs. Nothing but building it catches this.
      - name: nix build (the Nix lane is a shipped lane)
        run: nix build .#default --no-link --print-out-paths --show-trace

      - name: Build fixed-output derivations (catches stale vendor hashes)
        run: nix build --no-link .#default.cargoDeps .#onnxruntime-bin

  fuzz:
    name: fuzz (untrusted-input parsers)
    runs-on: [self-hosted, arch]
    timeout-minutes: 20
    env:
      # Every cargo/rustc in this job (including the child rustc that
      # cargo-fuzz spawns, which otherwise resolves the runner's default
      # stable and rejects the -Z sanitizer flags) uses the pinned nightly.
      RUSTUP_TOOLCHAIN: nightly-2026-07-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system build dependencies
        run: |
          # Self-hosted Arch runner has these preinstalled; apt path kept
          # for a hosted fallback.
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config clang libclang-dev libtss2-dev
          else
            for t in cc pkg-config clang; do command -v "$t" >/dev/null || { echo "::error::$t missing on the runner"; exit 1; }; done
          fi

      # Nightly is date-pinned so a rustc regression can't fail PRs that
      # changed nothing and masquerade as a fuzz finding. Bump the date (and
      # the cargo-fuzz version below) when touching the harness.
      - name: Install nightly Rust (cargo-fuzz needs it)
        # @master so `toolchain: nightly-...` is honored (the version-branch pin
        # ignored it; nightly only worked via the RUSTUP_TOOLCHAIN env fallback).
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-07-15

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # PRs RESTORE from main's cache but never SAVE their own: per-PR
          # entries were filling the repo's 10 GB cache quota, and LRU
          # eviction would eventually knock out the LFS model cache that
          # guards the (scarcer) LFS bandwidth quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz

      # Build cargo-fuzz with nightly: it (via cargo-platform) needs a rustc
      # newer than the pinned 1.88, and nightly is the toolchain the targets
      # build under anyway (RUSTUP_TOOLCHAIN above selects it for the whole
      # job). Version-pinned for the same reason the nightly is date-pinned.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # The generated corpus accumulates across runs via the cache below, so
      # each 45-second round explores from everything earlier rounds found
      # instead of restarting from the 5 seed files.
      # Restore on every run (PRs seed from the latest main corpus via
      # restore-keys), but SAVE only from main. Keyed on run_id, saving on
      # every PR would append a fresh entry each run and refill the 10 GB cache
      # quota — the same pressure the rust-cache `save-if` guard prevents (it
      # would LRU-evict the LFS model cache guarding the scarcer LFS bandwidth
      # quota). Restore/save are split so the save can be gated to main.
      - name: Restore fuzz corpus from previous runs
        id: fuzz-corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # Seed each corpus from the checked-in seeds (the generated corpus is not
      # committed), then fuzz for a bounded time. Replaying the seeds is a
      # regression gate: an input that once crashed a parser fails CI forever.
      # A crash exits non-zero and fails the job; the input is uploaded below.
      - name: Fuzz the IPC, envelope, and PCR-signature parsers
        working-directory: fuzz
        run: |
          for t in ipc_request pcr_signature sealed_envelope; do
            echo "::group::fuzz $t"
            mkdir -p "corpus/$t"
            cp -n "seeds/$t"/* "corpus/$t"/ 2>/dev/null || true
            cargo fuzz run "$t" -- -max_total_time=45 -rss_limit_mb=4096
            echo "::endgroup::"
          done

      # Persist the grown corpus only from main (see the restore step's note).
      - name: Save fuzz corpus
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          # Short retention on purpose: a crashing input on a public repo is a
          # ready-made repro for a daemon-parser DoS, so keep it just long
          # enough to fix the bug.
          retention-days: 3
          if-no-files-found: ignore
