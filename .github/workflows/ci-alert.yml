# CI health alert
#
# The nightly hardware suite lives on personal machines and fails silently:
# from 2026-09-10 to 2026-09-14 it was red four nights in a row for runner
# environment reasons and nothing surfaced it until release day, because the
# old hourly host monitor was retired with its agent. A genuine regression
# would have looked exactly the same. The advisory audit then failed every day
# from 2026-09-15 to 2026-09-24 and no alert named it, because this check
# watched only the suite and the install matrix.
#
# Daily, judge every workflow with an `on.schedule` trigger (read from the
# files in .github/workflows, so a new scheduled workflow is watched without
# an edit here) on two things: the latest completed run on main, and the age
# of the latest success against the schedule's longest gap plus one day. The
# second catches a runner that stays offline, whose newest run is always a
# young queued one. Each failing or stale workflow gets its own tracking issue
# (label ci-alert), commented at most once a day and closed once it stops
# alerting, so a lane that is already red cannot hide a new one. Logic and
# fixtures: scripts/ci/ci-alert.py and scripts/ci/test-ci-alert.py (run in
# ci.yml). No actions other than a pinned checkout, no secrets beyond the
# default token, and no pull_request trigger.
name: CI health alert

on:
  schedule:
    - cron: "15 9 * * *" # daily 09:15 UTC, after the 22:00 UTC nightly has had its chance
  workflow_dispatch:
    inputs:
      mode:
        description: "check = open/comment/close for real; dry = print verdicts only"
        default: dry
        type: choice
        options: [dry, check]

permissions:
  actions: read
  contents: read
  issues: write

env:
  ALERT_LABEL: ci-alert

jobs:
  check:
    name: scheduled workflow health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate scheduled workflows and maintain their tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          python3 scripts/ci/ci-alert.py --repo "$REPO" --label "$ALERT_LABEL" --mode "$MODE"
