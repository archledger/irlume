# zizmor configuration (https://docs.zizmor.sh/configuration/).
#
# Every `uses:` reference is hash-pinned. scripts/check-action-pins.sh
# enforces the same rule and gates CI on it; this config keeps zizmor's
# unpinned-uses audit at the same strictness.
#
# History: while the SLSA generic generator was in use, its reusable workflow
# had to be referenced by an @vX.Y.Z tag (its L3 model embeds the tag in the
# signed provenance identity and slsa-verifier validates it), so one ref-pin
# policy was scoped to that repository. The release workflow now attests with
# GitHub artifact attestations, and no exception remains.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
