# Monthly flake.lock refresh. Nothing else updates the nix inputs (Dependabot
# has no nix support), so without this the pinned nixpkgs ages silently.
#
# The update runs `nix flake check` plus the fixed-output-derivation build
# before pushing, so the branch arrives pre-validated in this run's log.
#
# This workflow pushes `deps/update-flake-lock` and stops there; it does not
# open the pull request. Doing so needs "Allow GitHub Actions to create and
# approve pull requests", a repository-wide permission that would apply to
# every workflow here, and this monthly refresh is not worth carrying it for
# (#228). A maintainer opens the PR from the pushed branch, so its checks run
# as an ordinary PR: runs from a workflow-token PR are created but held in an
# approval-required state, which is one more click on every refresh.
name: Update flake.lock

on:
  schedule:
    - cron: "15 6 1 * *"
  workflow_dispatch:

# The branch below is force-pushed, and both triggers can otherwise run at
# once: a slower earlier run would land its older lockfile on top of a newer
# one that had already finished, leaving the branch disagreeing with the
# summary that announced it.
concurrency:
  group: update-flake-lock
  cancel-in-progress: true

# Least privilege at the top; the one job that pushes a branch escalates
# below (Scorecard Token-Permissions best practice). `pull-requests: write`
# is deliberately absent: nothing here opens a PR.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reach.
          persist-credentials: false

      - name: Install Nix with flakes
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock and validate before proposing
        run: |
          nix flake update
          nix flake check --no-build --show-trace
          nix build --no-link .#default.cargoDeps .#onnxruntime-bin

      - name: Push the validated update branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: deps/update-flake-lock
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already current; nothing to push."
            echo "flake.lock is already current; nothing to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "deps: update flake.lock"
          # --force, not --force-with-lease: the branch is a rolling pointer
          # to the latest validated lockfile, recreated from main each run,
          # and the checkout has no remote-tracking ref to lease against. An
          # open PR from a previous refresh is meant to be updated in place.
          # The concurrency group above is what stops two runs racing here.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BRANCH"
          {
            echo "### flake.lock update ready"
            echo
            echo "Pushed \`$BRANCH\`. \`nix flake check\` and the"
            echo "fixed-output-derivation builds passed above."
            echo
            echo "Open a PR from it to run the required checks:"
            echo "<https://github.com/${GITHUB_REPOSITORY}/compare/$BRANCH?expand=1>"
          } >> "$GITHUB_STEP_SUMMARY"
